name: Refresh RuleQuant GitHub Pages Data

on:
  push:
    branches:
      - main
  schedule:
    # Check every hour. Unchanged data skips install/build/publish, so frequent
    # checks stay cheap while a newly published draw reaches friends quickly.
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: rulequant-pages-refresh
  cancel-in-progress: false

jobs:
  refresh-pages:
    runs-on: ubuntu-latest
    env:
      RULEQUANT_DRAW_SOURCE_URL: "https://thjffv.ag0rkv-4pnok-ljvvrg.xyz:16633/kj/3/2026.html"
      RULEQUANT_CLOUD_STATE_URL: "https://rulequant-terminal.vercel.app/api/cloud/state"
      RULEQUANT_DRAW_IMPORT_URL: "https://rulequant-terminal.vercel.app/api/import-draws-from-url"
      RULEQUANT_PAGES_REPO: "Xrenyan/rulequant-terminal-pages"
      RULEQUANT_PAGES_BRANCH: "main"
      RULEQUANT_PAGES_URL: "https://xrenyan.github.io/rulequant-terminal-pages/dashboard/"
      RULEQUANT_PAGES_DEPLOY_KEY: ${{ secrets.RULEQUANT_PAGES_DEPLOY_KEY }}
    steps:
      - name: Check Pages deploy key
        shell: bash
        run: |
          if [ -z "$RULEQUANT_PAGES_DEPLOY_KEY" ]; then
            echo "Missing RULEQUANT_PAGES_DEPLOY_KEY secret. Cannot push GitHub Pages refresh." >&2
            exit 1
          fi

      - name: Checkout app
        uses: actions/checkout@v4

      - name: Refresh static draw data
        run: node scripts/refresh-static-data.mjs

      - name: Check whether Pages needs publishing
        id: publish_check
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          (async () => {
            const local = JSON.parse(fs.readFileSync('public/static-cloud-state.json', 'utf8'));
            const comparable = (state) => ({
              draws: Array.isArray(state?.draws) ? state.draws : [],
              rules: Array.isArray(state?.rules) ? state.rules : [],
              samples: Array.isArray(state?.samples) ? state.samples : [],
              config: state?.config ?? null,
            });
            const hash = (state) => crypto.createHash('sha256').update(JSON.stringify(comparable(state))).digest('hex');
            let publish = process.env.GITHUB_EVENT_NAME !== 'schedule';
            let reason = publish ? 'source-code push or manual run' : 'scheduled data check';
            if (!publish) {
              try {
                const liveUrl = 'https://xrenyan.github.io/rulequant-terminal-pages/static-cloud-state.json?t=' + Date.now();
                const response = await fetch(liveUrl, { cache: 'no-store' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const live = await response.json();
                publish = hash(local) !== hash(live);
                reason = publish ? 'draws/rules/config changed' : 'live Pages data already matches';
              } catch (error) {
                publish = true;
                reason = `live comparison failed: ${error instanceof Error ? error.message : String(error)}`;
              }
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `publish=${publish}\nreason=${reason}\n`);
            console.log(JSON.stringify({ publish, reason, latestIssue: local?.meta?.latestIssue, drawCount: local?.draws?.length ?? 0 }, null, 2));
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Enable Corepack
        if: steps.publish_check.outputs.publish == 'true'
        run: corepack enable

      - name: Install dependencies
        if: steps.publish_check.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build GitHub Pages static site
        if: steps.publish_check.outputs.publish == 'true'
        env:
          GITHUB_PAGES: "true"
          GITHUB_PAGES_BASE_PATH: "/rulequant-terminal-pages"
          NEXT_PUBLIC_BASE_PATH: "/rulequant-terminal-pages"
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm run build:static-pages

      - name: Publish Pages repository
        if: steps.publish_check.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$RULEQUANT_PAGES_DEPLOY_KEY" > ~/.ssh/rulequant_pages_key
          chmod 600 ~/.ssh/rulequant_pages_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/rulequant_pages_key -o IdentitiesOnly=yes"
          rm -rf /tmp/rulequant-terminal-pages
          git clone "git@github.com:${RULEQUANT_PAGES_REPO}.git" /tmp/rulequant-terminal-pages
          cd /tmp/rulequant-terminal-pages
          git checkout "${RULEQUANT_PAGES_BRANCH}"
          find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +
          cp -R "${GITHUB_WORKSPACE}/out/." .
          touch .nojekyll
          git config user.name "RuleQuant Bot"
          git config user.email "rulequant-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "GitHub Pages already up to date."
          else
            git commit -m "Refresh RuleQuant static data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin "${RULEQUANT_PAGES_BRANCH}"
          fi

      - name: Verify Pages data
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.publish_check.outputs.publish }}" = "true" ]; then sleep 20; fi
          node - <<'NODE'
          (async () => {
            const stateUrl = 'https://xrenyan.github.io/rulequant-terminal-pages/static-cloud-state.json?t=' + Date.now();
            const pageUrl = 'https://xrenyan.github.io/rulequant-terminal-pages/dashboard/?t=' + Date.now();
            const state = await fetch(stateUrl, { cache: 'no-store' }).then((r) => {
              if (!r.ok) throw new Error(`static state HTTP ${r.status}`);
              return r.json();
            });
            const page = await fetch(pageUrl, { cache: 'no-store' });
            if (!page.ok) throw new Error(`dashboard HTTP ${page.status}`);
            const latest = state?.meta?.latestIssue;
            const count = Array.isArray(state?.draws) ? state.draws.length : 0;
            if (!latest || count === 0) throw new Error('static state missing latestIssue/draws');
            console.log(JSON.stringify({ latestIssue: latest, drawCount: count, dashboardStatus: page.status }, null, 2));
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
