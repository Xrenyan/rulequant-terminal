name: Deploy RuleQuant to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_P24QLq5l3GJslmP4BBgCgcBw
      VERCEL_PROJECT_ID: prj_b8ZECDbmlTZk93OlTiGrbCovpBSM
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check deployment token
        id: token
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Vercel automatic deployment is configured but waiting for VERCEL_TOKEN."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.token.outputs.available == 'true'
        uses: actions/checkout@v7

      - name: Enable Corepack
        if: steps.token.outputs.available == 'true'
        run: corepack enable

      - name: Install dependencies
        if: steps.token.outputs.available == 'true'
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel environment
        if: steps.token.outputs.available == 'true'
        run: pnpm dlx vercel@59.1.3 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        if: steps.token.outputs.available == 'true'
        run: pnpm dlx vercel@59.1.3 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        if: steps.token.outputs.available == 'true'
        run: pnpm dlx vercel@59.1.3 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
